<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pibble</title>
    <link rel="stylesheet" type="text/css" href="pibbledesign.css">
</head>
<body>
    <div class="container">
        <div class="box-container">
            <div class="heading">
                <h1>Pibbles</h1>
            </div>
            <div class="cards">
                <div class="card">
                    <img src="https://i.imgur.com/vkUBGDc.gif" alt="Avatar" style="width:50%">
                    <div class="texts">
                      <h4>Sir Charles Barkley</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="https://static.wikia.nocookie.net/pibble-verse/images/3/3b/Hamburger.jpg/revision/latest?cb=20251113155239" alt="Gmail" style="width:50%">
                    <div class="texts">
                      <h4>Gmail</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="https://static.wikia.nocookie.net/pibble-verse/images/0/0b/Email.webp/revision/latest?cb=20251109182109" alt="Email" style="width:50%">
                    <div class="texts">
                      <h4>Email</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="https://static.wikia.nocookie.net/pibble-verse/images/d/d4/Geeble2.png/revision/latest?cb=20251109220459" alt="Geeble" style="width:50%">
                    <div class="texts">
                      <h4>Geeble</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="https://static.wikia.nocookie.net/pibble-verse/images/e/e2/Washington.png/revision/latest/scale-to-width-down/1000?cb=20251108202124" alt="washington" style="width:50%">
                    <div class="texts">
                      <h4>Washington</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="https://static.wikia.nocookie.net/pibble-verse/images/7/71/Beeble.webp/revision/latest?cb=20251113141722" alt="beeble" style="width:50%">
                    <div class="texts">
                      <h4>Beeble</h4> 
                    </div>
                  </div>
            </div>
        </div>
    </div>
</body>
</html>
