<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pibble</title>
    <link rel="stylesheet" type="text/css" href="pibbledesign.css">
</head>
<body>
    <div class="container">
        <div class="box-container">
            <div class="heading">
                <h1>Pibbles</h1>
            </div>
            <div class="cards">
                <div class="card">
                    <img src="https://i.imgur.com/vkUBGDc.gif" alt="Avatar" style="width:50%">
                    <div class="texts">
                      <h4>Sir Charles Barkley</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="Hamburger.png" alt="Gmail" style="width:50%">
                    <div class="texts">
                      <h4>Gmail</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="Email.png" alt="Email" style="width:50%">
                    <div class="texts">
                      <h4>Email</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="Geeble2.png" alt="Geeble" style="width:50%">
                    <div class="texts">
                      <h4>Geeble</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="Washington.png" alt="washington" style="width:50%">
                    <div class="texts">
                      <h4>Washington</h4> 
                    </div>
                  </div>
                  <div class="card">
                    <img src="Beeble.png" alt="beeble" style="width:50%">
                    <div class="texts">
                      <h4>Beeble</h4> 
                    </div>
                  </div>
            </div>
        </div>
    </div>
</body>
</html>
